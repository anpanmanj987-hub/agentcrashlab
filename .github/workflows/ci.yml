name: Test and package
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit, real HTTP and CLI tests
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment and smoke test
        run: python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/test-results.xml
            artifacts/wheel-smoke/**
          retention-days: 7
