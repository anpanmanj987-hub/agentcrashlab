name: Bug report
description: Reproducible behavior that contradicts the documented contract
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic inputs only. Do not attach credentials, real customer data or unreviewed evidence bundles."
  - type: input
    id: version
    attributes:
      label: AgentCrashLab version, Python version and OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Exact command and a small redacted JSON scenario or policy.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual business state
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data review
      options:
        - label: This report contains no real credentials or customer data.
          required: true
